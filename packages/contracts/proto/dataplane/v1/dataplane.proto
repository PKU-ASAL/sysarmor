syntax = "proto3";

package sysarmor.dataplane.v1;

option go_package = "github.com/sysarmor/sysarmor-next-project/packages/contracts/proto/dataplane/v1;dataplanev1";

import "packages/contracts/proto/event/v1/event.proto";
import "packages/contracts/proto/signal/v1/signal.proto";

message DataBatch {
  BatchHeader header = 1;
  repeated EventFrame events = 2;
  repeated SignalFrame signals = 3;
  string schema_version = 4;
}

message BatchHeader {
  string batch_id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string host_id = 4;

  string policy_id = 5;
  uint64 policy_version = 6;
  string policy_mode = 7;

  uint64 event_seq_start = 8;
  uint64 event_seq_end = 9;
  uint64 signal_seq_start = 10;
  uint64 signal_seq_end = 11;

  uint32 event_count = 12;
  uint32 signal_count = 13;

  uint64 dropped_events_delta = 14;
  uint64 parse_errors_delta = 15;

  int64 created_at_unix_nano = 16;
  map<string, string> labels = 17;
  string enrollment_epoch = 18;
}

message EventFrame {
  uint64 sequence = 1;
  string observed_at = 2;
  sysarmor.event.v1.CanonicalEvent event = 3;
}

message SignalFrame {
  uint64 sequence = 1;
  string observed_at = 2;
  sysarmor.signal.v1.Signal signal = 3;
}

message DataAck {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACCEPTED = 1;
    STATUS_DUPLICATE = 2;
    STATUS_RETRYABLE = 3;
    STATUS_REJECTED = 4;
  }

  string batch_id = 1;
  bool accepted = 2;
  string message = 3;
  Status status = 4;
  string reason_code = 5;
  string committed_cursor = 6;
  string server_time = 7;
  uint64 accepted_events = 8;
  uint64 accepted_signals = 9;
  bool retryable = 10;
  uint64 retry_after_ms = 11;
  bool partial = 12;
  uint64 rejected_events = 13;
  uint64 rejected_signals = 14;
  string contract_version = 15;
}

service AgentDataPlaneService {
  rpc StreamBatches(stream DataBatch) returns (stream DataAck);
}
