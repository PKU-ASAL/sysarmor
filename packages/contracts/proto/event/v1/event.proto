syntax = "proto3";

package sysarmor.event.v1;

option go_package = "github.com/sysarmor/sysarmor-next-project/packages/contracts/proto/event/v1;eventv1";

message ProcessRef {
  string stable_id = 1;
  uint32 pid = 2;
  string binary = 3;
  repeated string argv = 4;
  uint32 uid = 5;
  uint64 start_time_ns = 6;
  bool argv_boundaries_trusted = 7;
}

message ObjectRef {
  string kind = 1;
  string file_path = 2;
  string socket_addr = 3;
  string target_proc_stable_id = 4;
}

message RuntimeScope {
  string type = 1;
  string selector = 2;
}

message CanonicalEvent {
  string id = 1;
  uint64 seq = 2;
  string agent_id = 3;
  string host_id = 4;
  reserved 5;
  reserved "scenario";
  uint64 mono_ns = 6;
  reserved 7;
  ProcessRef subject_proc = 8;
  ObjectRef object = 9;
  string parent_stable_id = 10;
  string lineage_id = 11;
  string raw_ref = 12;
  string tenant_id = 13;
  RuntimeScope scope = 14;
  string container_id = 15;
  string cgroup = 16;
  string namespace = 17;
  string pod = 18;
  uint64 occurred_at_ns = 19;
  string behavior = 20;
  map<string, string> labels = 21;
  string identity_status = 22;
}
