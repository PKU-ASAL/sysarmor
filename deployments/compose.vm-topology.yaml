services:
  postgres:
    build:
      dockerfile: Dockerfile.vm

  kafka:
    build:
      dockerfile: Dockerfile.vm
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sysarmor
      MINIO_ROOT_PASSWORD: sysarmor-secret
    volumes:
      - flink-checkpoints:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-06-13T21-53-57Z
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 sysarmor sysarmor-secret &&
      mc mb --ignore-existing local/sysarmor-flink"
    depends_on:
      minio:
        condition: service_healthy

  flink-jobmanager:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    command: jobmanager
    depends_on:
      kafka:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - streaming/streaming.env.example
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      AWS_ENDPOINT: http://minio:9000
      FLINK_PROPERTIES: |
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: sysarmor
        s3.secret-key: sysarmor-secret

  flink-taskmanager:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    env_file:
      - streaming/streaming.env.example
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: "2"
      AWS_ENDPOINT: http://minio:9000
      FLINK_PROPERTIES: |
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: sysarmor
        s3.secret-key: sysarmor-secret

  flink-normalize:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    command: ["flink", "run", "-m", "flink-jobmanager:8081", "-py", "/opt/sysarmor/streaming/src/sysarmor_streaming/entrypoints.py"]
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    env_file:
      - streaming/streaming.env.example
    environment:
      SYSARMOR_FLINK_JOB: normalize
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager

  flink-detection:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    command: ["flink", "run", "-m", "flink-jobmanager:8081", "-py", "/opt/sysarmor/streaming/src/sysarmor_streaming/entrypoints.py"]
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    env_file:
      - streaming/streaming.env.example
    environment:
      SYSARMOR_FLINK_JOB: detection
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager

  flink-projection:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    command: ["flink", "run", "-m", "flink-jobmanager:8081", "-py", "/opt/sysarmor/streaming/src/sysarmor_streaming/entrypoints.py"]
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    env_file:
      - streaming/streaming.env.example
    environment:
      SYSARMOR_FLINK_JOB: projection
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager

  redis:
    build:
      dockerfile: Dockerfile.vm

  opensearch:
    build:
      dockerfile: Dockerfile.vm

  manager:
    build:
      context: ./vm-build/manager
      dockerfile: Dockerfile
    ports:
      - "9443:9443"

  gateway:
    build:
      context: ./vm-build/gateway
      dockerfile: Dockerfile
    ports:
      - "9444:9444"
      - "9445:9445"

  worker:
    build:
      context: ./vm-build/worker
      dockerfile: Dockerfile

volumes:
  flink-checkpoints:
