services:
  postgres:
    build: ./infra/postgres
    container_name: sysarmor-postgres
    environment:
      POSTGRES_DB: sysarmor
      POSTGRES_USER: sysarmor
      POSTGRES_PASSWORD: sysarmor
    ports:
      - "${SYSARMOR_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysarmor -d sysarmor"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    build: ./infra/kafka
    container_name: sysarmor-kafka
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "${SYSARMOR_KAFKA_PORT:-19092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: sysarmor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sysarmor
      MINIO_ROOT_PASSWORD: sysarmor-secret
    volumes:
      - flink-checkpoints:/data
    ports:
      - "${SYSARMOR_MINIO_PORT:-19000}:9000"
      - "${SYSARMOR_MINIO_CONSOLE_PORT:-19001}:9001"

  minio-init:
    image: minio/mc:RELEASE.2024-06-13T21-53-57Z
    container_name: sysarmor-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 sysarmor sysarmor-secret; do sleep 1; done;
      mc mb --ignore-existing local/sysarmor-flink"

  flink-jobmanager:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    container_name: sysarmor-flink-jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_completed_successfully
    env_file:
      - ./streaming/streaming.env.example
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      AWS_ENDPOINT: http://minio:9000
    ports:
      - "${SYSARMOR_FLINK_UI_PORT:-18081}:8081"

  flink-taskmanager:
    build:
      context: ..
      dockerfile: deployments/streaming/Dockerfile
    container_name: sysarmor-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    env_file:
      - ./streaming/streaming.env.example
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: "2"
      AWS_ENDPOINT: http://minio:9000

  redis:
    build: ./infra/redis
    container_name: sysarmor-redis
    ports:
      - "${SYSARMOR_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

  opensearch:
    build: ./infra/opensearch
    image: sysarmor-opensearch:latest
    container_name: sysarmor-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${SYSARMOR_OPENSEARCH_PORT:-29200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch-init:
    image: sysarmor-opensearch:latest
    container_name: sysarmor-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/sysarmor/opensearch/init.sh"]
    environment:
      SYSARMOR_OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./opensearch:/opt/sysarmor/opensearch:ro

  packages:
    image: nginx:alpine
    container_name: sysarmor-packages
    volumes:
      - ../dist/release:/usr/share/nginx/html:ro
    ports:
      - "${SYSARMOR_PACKAGE_PORT:-18080}:80"

  manager:
    build:
      context: ..
      dockerfile: deployments/manager/Dockerfile
    container_name: sysarmor-manager
    depends_on:
      packages:
        condition: service_started
      postgres:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    env_file:
      - ./manager/manager.env.example
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_ARTIFACT_DIR: /var/lib/sysarmor/manager/artifacts
      SYSARMOR_AGENT_PACKAGE_INDEX_URL: http://packages/index.json
      SYSARMOR_AGENT_PACKAGE_DOWNLOAD_BASE_URL: ${SYSARMOR_AGENT_PACKAGE_DOWNLOAD_BASE_URL:-http://127.0.0.1:18080}
      SYSARMOR_ARTIFACT_PUBLIC_KEY: /etc/sysarmor/pki/artifact-public.pem
      SYSARMOR_AGENT_CA_CERT: /etc/sysarmor/pki/ca.pem
      SYSARMOR_AGENT_CA_KEY: /etc/sysarmor/pki/ca-key.pem
    volumes:
      - manager-artifacts:/var/lib/sysarmor/manager/artifacts
      - ./pki/agent-plane-mtls/runtime:/etc/sysarmor/pki:ro
    ports:
      - "${SYSARMOR_MANAGER_PORT:-19443}:9443"

  manager-ui:
    build:
      context: ..
      dockerfile: deployments/manager-ui/Dockerfile
    container_name: sysarmor-manager-ui
    depends_on:
      manager:
        condition: service_started
    env_file:
      - ./manager-ui/manager-ui.env.example
    secrets:
      - auth-secret
      - bootstrap-admin-username
      - bootstrap-admin-password
      - manager-jwt-private.pem
    ports:
      - "${SYSARMOR_MANAGER_UI_PORT:-4173}:4173"

  gateway:
    build:
      context: ..
      dockerfile: deployments/gateway/Dockerfile
    container_name: sysarmor-gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./gateway/gateway.env.example
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_REDIS_ADDR: redis:6379
    volumes:
      - ./pki/agent-plane-mtls/runtime:/etc/sysarmor/pki:ro
    ports:
      - "${SYSARMOR_GATEWAY_PORT:-19444}:9444"
      - "${SYSARMOR_GATEWAY_HEALTH_PORT:-19445}:9445"

  worker:
    build:
      context: ..
      dockerfile: deployments/worker/Dockerfile
    container_name: sysarmor-worker
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    env_file:
      - ./worker/worker.env.example
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_KAFKA_TOPIC: sysarmor.agent.databatch.raw
      SYSARMOR_KAFKA_GROUP_ID: sysarmor-ingest-worker
      SYSARMOR_OPENSEARCH_URL: http://opensearch:9200

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  manager-artifacts:
  flink-checkpoints:

secrets:
  auth-secret:
    file: ./pki/agent-plane-mtls/runtime/auth-secret
  bootstrap-admin-username:
    file: ./pki/agent-plane-mtls/runtime/bootstrap-admin-username
  bootstrap-admin-password:
    file: ./pki/agent-plane-mtls/runtime/bootstrap-admin-password
  manager-jwt-private.pem:
    file: ./pki/agent-plane-mtls/runtime/manager-jwt-private.pem
