[project]
name = "sysarmor-streaming"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "apache-flink==1.20.2",
]

[dependency-groups]
dev = [
  "grpcio-tools==1.59.3",
  "setuptools==70.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming", "src/packages"]
