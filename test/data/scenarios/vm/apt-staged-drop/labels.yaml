name: apt-staged-drop
kind: malicious
window: workload
objectives:
  alert:
    required_events:
      - helper_c2
    required_signals:
      - suspicious_exec_connect
  evidence:
    required_events:
      - helper_download
      - helper_write
      - helper_exec
      - helper_c2
    required_signals:
      - download_by_lolbin
      - payload_dropped
      - suspicious_exec_connect
      - dropped_payload_executed_and_connects
labels:
  events:
    - id: helper_download
      behavior: network.connect
      match:
        socket: "10.66.0.99:8080"
        process: "*curl*"
    - id: helper_write
      behavior: file.write
      match:
        path: "/var/lib/app/plugins/helper"
    - id: helper_chmod
      behavior: file.chmod
      match:
        path: "/var/lib/app/plugins/helper"
    - id: helper_exec
      behavior: process.exec
      match:
        process: "/var/lib/app/plugins/helper"
    - id: helper_c2
      behavior: network.connect
      match:
        socket: "10.66.0.99:443"
  signals:
    - id: download_by_lolbin
      name: download_by_lolbin
      entities:
        - "socket:10.66.0.99:8080"
      link_events:
        - helper_download
    - id: payload_dropped
      name: payload_dropped
      stage: candidate
      entities:
        - "file:/var/lib/app/plugins/helper"
      link_events:
        - helper_write
    - id: suspicious_exec_connect
      name: suspicious_exec_connect
      stage: candidate
      entities:
        - "file:/var/lib/app/plugins/helper"
        - "socket:10.66.0.99:443"
      link_events:
        - helper_exec
        - helper_c2
    - id: dropped_payload_executed_and_connects
      name: dropped_payload_executed_and_connects
      where: CLOUD
      entities:
        - "file:/var/lib/app/plugins/helper"
        - "socket:10.66.0.99:443"
      link_events:
        - helper_write
        - helper_exec
        - helper_c2
policy:
  conclusion_signals_allowed: 0
