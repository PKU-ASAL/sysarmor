# apt-staged-drop 契约（成功判据②：云端图立论）
endpoint_signals:
  must_have_entities: true
  must_contain:
    - { name: payload_dropped, stage: candidate,
        entities_keys: ["file:/var/lib/app/plugins/helper"] }   # lineage A
    - { name: suspicious_exec_connect, stage: candidate,
        entities_keys: ["file:/var/lib/app/plugins/helper", "socket:10.66.0.99:443"] } # lineage B
cloud_signals:
  must_contain:
    - { name: dropped_payload_executed_and_connects, cross_lineage: true }
incident:
  count: 1
  lineage_ids_min: 2                 # 跨谱系
  evidence_subgraph_contains_node: "/var/lib/app/plugins/helper"  # 经 file 节点相连
  converge_method: "rarity+causal-topk"
negative:
  endpoint_conclusion_required: false
  endpoint_conclusion_count: 0
control_assertions:
  - disable: cloud.cross_lineage     # ★ 关闭缝合则不成案 → 证明云端图立论
    then_incident_count: 0
