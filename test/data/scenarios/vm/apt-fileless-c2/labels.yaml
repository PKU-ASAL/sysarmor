name: apt-fileless-c2
kind: malicious
window: workload
objectives:
  alert:
    required_events:
      - reverse_c2
    required_signals:
      - reverse_shell_pattern
  evidence:
    required_events:
      - payload_download
      - payload_write
      - payload_exec
      - reverse_c2
    required_signals:
      - download_by_lolbin
      - payload_dropped
      - payload_lifecycle
      - reverse_shell_pattern
labels:
  events:
    - id: payload_download
      behavior: network.connect
      match:
        socket: "10.66.0.99:8080"
        process: "*curl*"
    - id: payload_write
      behavior: file.write
      match:
        path: "/dev/shm/x.sh"
    - id: payload_beacon_write
      behavior: file.write
      match:
        path: "/dev/shm/.beacon"
    - id: payload_chmod
      behavior: file.chmod
      match:
        path: "/dev/shm/x.sh"
    - id: payload_exec
      behavior: process.exec
      match:
        process: "/dev/shm/x.sh"
    - id: reverse_c2
      behavior: network.connect
      match:
        socket: "10.66.0.99:443"
  signals:
    - id: download_by_lolbin
      name: download_by_lolbin
      entities:
        - "socket:10.66.0.99:8080"
      link_events:
        - payload_download
    - id: payload_dropped
      name: payload_dropped
      entities:
        - "file:/dev/shm/x.sh"
      link_events:
        - payload_write
    - id: payload_dropped_beacon
      name: payload_dropped
      entities:
        - "file:/dev/shm/.beacon"
    - id: payload_lifecycle
      name: payload_lifecycle
      entities:
        - "file:/dev/shm/.beacon"
        - "socket:10.66.0.99:443"
      link_events:
        - payload_beacon_write
        - payload_exec
        - reverse_c2
    - id: reverse_shell_pattern
      name: reverse_shell_pattern
      stage: conclusion
      entities:
        - "socket:10.66.0.99:443"
      link_events:
        - reverse_c2
