# 拓扑 A：容器拓扑（Manager installer 保护 node-a）
# 用法: cd test/environments/container && docker compose up -d
# 清理: docker compose down -v
#
# attacker  10.66.0.99  C2 (http :8080 + nc :443)
# node-a    10.66.0.11  受害端点（web 运行时 + CI 构建 + 假凭据）
# mgr       10.66.0.10  manager control/query API
# gateway   10.66.0.14  agent data/control endpoint
# worker    10.66.0.13  Kafka ingest consumer + detection/indexing
# postgres 10.66.0.20  control/state/audit store
# kafka    10.66.0.21  telemetry ingest log
# redis    10.66.0.22  hot state
# opensearch 10.66.0.23 evidence/search layer

services:
  attacker:
    build: ./images/attacker
    container_name: attacker
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.99

  node-a:
    build: ./images/node-a
    container_name: node-a
    privileged: true
    cgroup: host
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.11
    volumes:
      - app-plugins:/var/lib/app/plugins
      - node-secrets:/var/run/secrets/kubernetes.io/serviceaccount
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf

  mgr:
    build:
      context: ../../.results/container-runtime/manager
      dockerfile: Dockerfile
    container_name: mgr
    depends_on:
      postgres:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.10
    ports:
      - "${SYSARMOR_TEST_MANAGER_PORT:-29443}:9443"
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_OPENSEARCH_URL: http://10.66.0.23:9200
      SYSARMOR_OPENSEARCH_USERNAME: admin
      SYSARMOR_OPENSEARCH_PASSWORD: admin
      SYSARMOR_ARTIFACT_DIR: /var/lib/sysarmor/manager/artifacts
      TMPDIR: /var/lib/sysarmor/manager/artifacts
      SYSARMOR_ARTIFACT_PUBLIC_KEY: /etc/sysarmor/pki/artifact-public.pem
      SYSARMOR_AGENT_CA_CERT: /etc/sysarmor/pki/ca.pem
      SYSARMOR_AGENT_CA_KEY: /etc/sysarmor/pki/ca-key.pem
      SYSARMOR_JWT_PUBLIC_KEY_FILE: /etc/sysarmor/pki/manager-jwt-public.pem
      SYSARMOR_JWT_ISSUER: sysarmor-test
      SYSARMOR_JWT_AUDIENCE: sysarmor-manager
    volumes:
      - ../../../bin:/opt/sysarmor/bin:ro
      - ../../.results/container-runtime/pki:/etc/sysarmor/pki:ro
      - manager-artifacts:/var/lib/sysarmor/manager/artifacts

  gateway:
    build:
      context: ../../.results/container-runtime/gateway
      dockerfile: Dockerfile
    container_name: gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.14
    ports:
      - "${SYSARMOR_TEST_GATEWAY_PORT:-29444}:9444"
      - "${SYSARMOR_TEST_GATEWAY_HEALTH_PORT:-29445}:9445"
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_REDIS_ADDR: redis:6379
      SYSARMOR_GRPC_TLS_CERT: /etc/sysarmor/pki/gateway.pem
      SYSARMOR_GRPC_TLS_KEY: /etc/sysarmor/pki/gateway-key.pem
      SYSARMOR_GRPC_CLIENT_CA: /etc/sysarmor/pki/ca.pem
    volumes:
      - ../../../bin:/opt/sysarmor/bin:ro
      - ../../.results/container-runtime/pki:/etc/sysarmor/pki:ro

  worker:
    build:
      context: ../../.results/container-runtime/worker
      dockerfile: Dockerfile
    container_name: worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.13
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_KAFKA_TOPIC: sysarmor.agent.databatch.raw
      SYSARMOR_KAFKA_GROUP_ID: sysarmor-ingest-worker
      SYSARMOR_OPENSEARCH_URL: http://10.66.0.23:9200
      SYSARMOR_OPENSEARCH_USERNAME: admin
      SYSARMOR_OPENSEARCH_PASSWORD: admin

  postgres:
    image: postgres:16-alpine
    container_name: sysarmor-test-postgres
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.20
    environment:
      POSTGRES_DB: sysarmor
      POSTGRES_USER: sysarmor
      POSTGRES_PASSWORD: sysarmor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysarmor -d sysarmor"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:latest
    pull_policy: never
    container_name: sysarmor-test-kafka
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.21
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: sysarmor-test-redis
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.22

  opensearch:
    image: sysarmor-opensearch:latest
    pull_policy: never
    container_name: sysarmor-test-opensearch
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.23
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch-init:
    image: sysarmor-opensearch:latest
    pull_policy: never
    container_name: sysarmor-test-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/sysarmor/opensearch/init.sh"]
    networks:
      sysarmor-net:
    environment:
      SYSARMOR_OPENSEARCH_URL: http://10.66.0.23:9200
    volumes:
      - ../../../deployments/opensearch:/opt/sysarmor/opensearch:ro

networks:
  sysarmor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.66.0.0/24

volumes:
  app-plugins:
  node-secrets:
  manager-artifacts:
  postgres-data:
  opensearch-data:
