name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the leading v
        required: true
        type: string
      accepted_rc_tag:
        description: Accepted RC tag with the same Git tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate main and accepted RC tree
        id: validate
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RC_TAG: ${{ inputs.accepted_rc_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "This workflow must be dispatched from main." >&2
            exit 2
          fi
          [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must use MAJOR.MINOR.PATCH." >&2
            exit 2
          }
          [[ "$RC_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[1-9][0-9]*$ ]] || {
            echo "accepted_rc_tag must be an RC of v$VERSION_INPUT." >&2
            exit 2
          }
          [[ "${BASH_REMATCH[1]}" == "$VERSION_INPUT" ]] || {
            echo "accepted_rc_tag must be an RC of v$VERSION_INPUT." >&2
            exit 2
          }
          git fetch --force origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          head_tree="$(git rev-parse "HEAD^{tree}")"
          rc_tree="$(git rev-parse "$RC_TAG^{tree}")"
          [[ "$head_tree" == "$rc_tree" ]] || {
            echo "main Git tree differs from accepted RC $RC_TAG." >&2
            exit 1
          }
          version="v$VERSION_INPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag already exists: $version" >&2
            exit 1
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      release_type: ga
      content_key_id: sysarmor-production
      release_environment: production-release

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/github-release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          ASSET_DIR: ${{ github.workspace }}/dist/github-release
        run: |
          set -euo pipefail
          deployments/packages/render-github-release-notes.sh "$VERSION" "$GITHUB_REPOSITORY" ga >"$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" "$ASSET_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "SysArmor $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
