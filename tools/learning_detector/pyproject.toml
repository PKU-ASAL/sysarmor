[project]
name = "sysarmor-learning-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "gensim>=4.3,<5",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
